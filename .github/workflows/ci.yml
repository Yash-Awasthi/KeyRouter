name: ci

on:
  push:
    branches: [master]
  pull_request:

# Nothing here needs write access, and a fork's pull request should not get any.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.15 is the documented floor (it is when module.registerHooks landed); 24 is the current LTS.
        node: ["22.15", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Lint
        # Biome, plus the page gate: no raw HTML sinks, every control labelled, every error announced.
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Bundle the worker without deploying
        # The same command a user runs to deploy, minus the upload: it catches a broken wrangler.jsonc or DO migration.
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry"
