<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>KeyRouter invite</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f5bea; --danger: #c43c2b; --ok: #2b7a3d; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --text: #ececE8; --muted: #9a9a93; --line: #33332f; --accent: #7d9bff; --danger: #ff7a68; --ok: #6fcf86; --on-accent: #10131c; }
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: inherit; cursor: pointer; }
  .err { color: var(--danger); margin-top: 12px; }
  .ok { color: var(--ok); margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Join KeyRouter</h1>
  <p class="sub">Register a passkey for the read-only view of this gateway's keys and usage.</p>
  <div class="card">
    <p class="sub" id="who">Checking the invite…</p>
    <form id="form" hidden>
      <label for="name">Name this passkey</label>
      <input id="name" autocomplete="off" placeholder="Laptop" aria-describedby="err">
      <button type="submit" id="join">Create a passkey</button>
    </form>
    <p class="ok" id="done" hidden>Registered. You can open the admin page now; it will be read-only.</p>
    <p class="err" id="err" role="alert"></p>
  </div>
</main>
<script>
  const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
  const unb64u = (s) => Uint8Array.from(atob(s.replaceAll("-", "+").replaceAll("_", "/")), (c) => c.charCodeAt(0));
  const code = new URLSearchParams(location.search).get("code") || "";
  const err = document.getElementById("err");
  const fail = (text) => {
    err.textContent = text;
    document.getElementById("who").textContent = "This invite cannot be used.";
    document.getElementById("form").hidden = true;
  };
  if (!code) fail("The link has no invite code; ask the owner for a new one.");
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = "";
    try {
      const o = await (await fetch("/join/options", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) })).json();
      if (o.error) throw new Error(o.error.message);
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: unb64u(o.challenge),
        rp: o.rp,
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: o.label || "viewer", displayName: o.label || "KeyRouter viewer" },
        pubKeyCredParams: [-7, -8, -257].map((alg) => ({ type: "public-key", alg })),
        authenticatorSelection: { residentKey: "required", userVerification: "required" },
        timeout: 60000,
      } });
      const r = cred.response;
      if (!r.getPublicKey) throw new Error("This browser cannot register passkeys here; try a current Chrome, Edge, Safari or Firefox.");
      const res = await fetch("/join/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code, id: cred.id, clientDataJSON: b64u(r.clientDataJSON), publicKey: b64u(r.getPublicKey()), alg: r.getPublicKeyAlgorithm(), name: document.getElementById("name").value.trim() }),
      });
      if (!res.ok) throw new Error((await res.json()).error.message);
      document.getElementById("form").hidden = true;
      document.getElementById("done").hidden = false;
      document.getElementById("who").textContent = "Invite accepted.";
    } catch (e) {
      err.textContent = e.name === "NotAllowedError" ? "Passkey creation was cancelled or timed out." : e.message;
    }
  };
  fetch("/join/options", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) })
    .then((r) => r.json())
    .then((o) => {
      if (o.error) return fail(o.error.message);
      document.getElementById("who").textContent = "This invite is for: " + (o.label || "a viewer") + ".";
      document.getElementById("form").hidden = false;
    })
    .catch(() => fail("The invite could not be checked. Try the link again."));
</script>
</body>
</html>
